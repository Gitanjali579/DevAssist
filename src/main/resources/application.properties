spring.application.name=devassist-backend
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/devassist_db
spring.datasource.username=postgres
spring.datasource.password=YOUR_POSTGRES_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

ai.api.url=https://generativelanguage.googleapis.com
ai.api.key=YOUR_GEMINI_API_KEY
ai.model=gemini-3.6-flash
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

logging.level.com.gitanjali.devassist=INFO
logging.level.org.springframework.web=INFO

